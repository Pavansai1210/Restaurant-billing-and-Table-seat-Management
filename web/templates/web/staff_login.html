{% extends 'web/base.html' %}
{% load static %}
{% block title %}Staff login{% endblock %}
{% block content %}
<h1>Staff login</h1>
<p class="muted">For restaurant staff only.</p>
<form id="login" class="card" method="get" action="/staff/login/">
  <label for="username">Username</label>
  <input id="username" type="text" autocomplete="username" required>
  <label for="password">Password</label>
  <input id="password" type="password" autocomplete="current-password" required>
  <button type="submit" id="submit" class="primary">Log in</button>
  <p id="message" class="message" hidden></p>
</form>
{% endblock %}
{% block scripts %}
<script src="{% static 'web/js/staff.js' %}?v=5"></script>
<script src="{% static 'web/js/staff_login.js' %}?v=3"></script>
{% endblock %}
